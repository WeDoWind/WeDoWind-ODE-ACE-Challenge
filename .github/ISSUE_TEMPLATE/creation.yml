name: Share a creation
description: Share your creation with a title, creators, description, URL, and screenshot
title: "[Creation] "
body:
  - type: markdown
    attributes:
      value: "Share the five details below. A maintainer will follow up about source files and licensing before adding your creation to the gallery. Official entry also requires a comment on the WeDoWind Solutions task."
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: input
    id: creators
    attributes:
      label: Creators
      description: Names of the creators or team to credit.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: Public link where people can view your creation.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag in a PNG, JPEG, or WebP screenshot that you have permission to share publicly.
    validations:
      required: true
