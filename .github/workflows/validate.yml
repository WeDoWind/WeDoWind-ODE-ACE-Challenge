name: Validate gallery
on:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: node scripts/test-ace-poller.mjs
      - run: node site/creations/ace-wind-now/test.mjs
